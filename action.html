<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="keywords" />
    <title>Sukhinho jiu jitsu</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" media="screen and (max-width: 768px)" href="css/mobile.css" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f4f4f4;
        overflow-y: auto;
      }

      #navbar {
        background: #333;
      }
      #navbar .logo a,
      #navbar ul li a {
        color: #fff;
        text-decoration: none;
      }
      #navbar ul {
        list-style: none;
        display: flex;
        gap: 15px;
      }
      #navbar .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
      }

      .swiper-container {
        width: 100%;
        height: 700px;
      }
      .swiper-slide img {
        width: 100%;
        height: 700px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <header>
      <nav id="navbar">
        <div class="container">
          <h1 class="logo">
            <a href="index.html">HOME</a>
          </h1>
          <ul>
            <li><a href="action.html">In action photos</a></li>
            <li><a href="award.html">Awards</a></li>
            <li><a href="contact.html">Contact with Sukhinho</a></li>
            <li><a href="sign.html">Sign / Sign up</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <section id="about-info" class="bg-light py-3">
      <div class="swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="img/action1.jpg" alt="Action 1" /></div>
          <div class="swiper-slide"><img src="img/action2.jpg" alt="Action 2" /></div>
          <div class="swiper-slide"><img src="img/action3.jpg" alt="Action 3" /></div>
        </div>
      </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <script>
      var swiper = new Swiper('.swiper-container', {
        direction: 'vertical',
        loop: true,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false
        },
      });
    </script>
  </body>
</html>
