<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sukhinho Jiu Jitsu</title>

<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/8a206a71da.js" crossorigin="anonymous"></script>

<!-- CSS -->
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" media="screen and (max-width: 768px)" href="css/mobile.css" />
<link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  font-family: 'Courgette', cursive;
  overflow: hidden; /* hides page scrollbar */
  height: 100vh;
}

#navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #333;
  height: 60px;
  z-index: 10;
  overflow: hidden;
}
#navbar .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
}
#navbar a {
  color: #fff;
  text-decoration: none;
  margin-left: 20px;
}

.instructor {
  text-align: center;
  margin-top: 60px;
  padding: 100px 0 40px;
  color: #fff;
}

.course-slider {
  position: absolute;
  top: 120px;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.swiper-container {
  width: 600px;
  height: 600px;
  overflow: hidden; /* hide adjacent slides */
}
.swiper-wrapper {
  height: 100%;
}
.swiper-slide {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}
.swiper-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 5px;
}
</style>
</head>

<body>
<header id="navbar">
  <div class="container">
    <h1 class="logo"><a href="index1.html">Sukhbat</a></h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="lesson.html">Lesson</a>
      <a href="action1.html">Photos</a>
      <a href="award1.html">Diet</a>
      <a href="contact1.html">Contact</a>
      <a href="profile.html">My Profile</a>
      <!-- Logout link -->
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </div>
</header>

<section class="instructor">
  <h2>You can't teach heart</h2>
</section>

<section class="course-slider">
  <div class="swiper-container">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="img1/t1.jpg" alt="Action Photo 1"></div>
      <div class="swiper-slide"><img src="img1/t2.jpg" alt="Action Photo 2"></div>
      <div class="swiper-slide"><img src="img1/img/action3.jpg" alt="Action Photo 3"></div>
      <div class="swiper-slide"><img src="img1/img/action4.jpg" alt="Action Photo 4"></div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
<script>
  new Swiper('.swiper-container', {
    direction: 'vertical',
    loop: true,
    slidesPerView: 1,
    spaceBetween: 0,
    autoplay: { delay: 2000, disableOnInteraction: false }
  });
</script>
</body>
</html>
