<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="keywords" />
  <title>Sukhinho Jiu Jitsu</title>
  <script src="https://kit.fontawesome.com/8a206a71da.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../sukhinhojj_/css/style.css" />
  <link rel="stylesheet" media="screen and (max-width: 768px)" href="css/mobile.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="container">
        <h1 class="logo">
          <a href="index.html">HOME</a>
        </h1>
        <ul>
          <li><a href="action.html">In Action Photos</a></li>
          <li><a href="award.html">Awards</a></li>
          <li><a href="contact.html">Contact with Sukhbat</a></li>
          <li><a href="sign.html" class="current">Sign / Sign Up</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <section id="contact-form" class="py-3">
    <div class="container">
      <div class="form-container active" id="login-form">
        <h2>Sign In</h2>
        <form id="signInForm" method="POST">
          <input type="email" id="signInEmail" name="email" placeholder="Email" required />
          <input type="password" id="signInPassword" name="password" placeholder="Password" required />
          <button type="submit">Sign In</button>
          <button type="button" id="switch-to-register">Don't have an account? Register</button>
        </form>
      </div>
      <div class="form-container" id="register-form">
        <h2>Sign Up</h2>
        <form id="signUpForm" method="POST">
          <input type="text" id="signUpName" name="name" placeholder="Name" required />
          <input type="email" id="signUpEmail" name="email" placeholder="Email" required />
          <input type="password" id="signUpPassword" name="password" placeholder="Password" required />
          <button type="submit">Sign Up</button>
          <button type="button" id="switch-to-login">Already have an account? Login</button>
        </form>
      </div>
    </div>
  </section>

  <footer id="main-footer">
    <p>&copy; 2024 Sukhinho Jiu Jitsu</p>
  </footer>

  <script>
    // JavaScript to handle form submissions and switching forms
    document.addEventListener('DOMContentLoaded', () => {
      const signInForm = document.getElementById('signInForm');
      const signUpForm = document.getElementById('signUpForm');
      const switchToRegisterButton = document.getElementById('switch-to-register');
      const switchToLoginButton = document.getElementById('switch-to-login');
      const loginFormContainer = document.getElementById('login-form');
      const registerFormContainer = document.getElementById('register-form');

      // Show register form
      switchToRegisterButton.addEventListener('click', () => {
        loginFormContainer.classList.remove('active');
        registerFormContainer.classList.add('active');
      });

      // Show login form
      switchToLoginButton.addEventListener('click', () => {
        registerFormContainer.classList.remove('active');
        loginFormContainer.classList.add('active');
      });

      // Sign-In form handler
      signInForm.addEventListener('submit', async (event) => {
        event.preventDefault(); // Prevent default form submission

        const email = document.getElementById('signInEmail').value;
        const password = document.getElementById('signInPassword').value;
        const submitButton = signInForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;

        try {
          const response = await fetch('http://localhost:8080/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          if (response.ok) {
            // Parse JSON response and store token if present
            const data = await response.json();
            if (data.token) {
              localStorage.setItem('authToken', data.token);
            }
            // Redirect to dashboard without alert
            window.location.href = 'dashboard.html';
          } else {
            const errorText = await response.text();
            alert('Login failed: ' + errorText);
          }
        } catch (error) {
          alert('An error occurred: ' + error.message);
        } finally {
          submitButton.disabled = false;
        }
      });

      // Sign-Up form handler
      signUpForm.addEventListener('submit', async (event) => {
        event.preventDefault(); // Prevent default form submission

        const name = document.getElementById('signUpName').value;
        const email = document.getElementById('signUpEmail').value;
        const password = document.getElementById('signUpPassword').value;

        try {
          const response = await fetch('http://localhost:8080/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
          });

          if (response.ok) {
            alert('Registration successful! Please login.');
            // Switch to the login form after successful registration
            registerFormContainer.classList.remove('active');
            loginFormContainer.classList.add('active');
          } else {
            const errorText = await response.text();
            alert('Registration failed: ' + errorText);
          }
        } catch (error) {
          alert('An error occurred: ' + error.message);
        }
      });
    });
  </script>
</body>
</html>
