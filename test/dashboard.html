<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="keywords" content="Sukhinho Jiu Jitsu, Dashboard" />
  <script src="https://kit.fontawesome.com/8a206a71da.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" media="screen and (max-width: 768px)" href="css/mobile.css" />
  <title>Sukhinho Jiu Jitsu Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet" />
  <style>
    /* Ensure BOTH html and body are black with zero margins, 
       and body is at least full viewport height. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* Make sure we allow scrolling if content exceeds the viewport */
    body {
      min-height: 100vh; 
      /* remove overflow: hidden; so you can see all content */
      overflow: hidden;
    }

    /* Header: dark grey background, white text */
    header {
      background-color: #333;
      color: white;
      padding: 10px 0;
    }

    /* Footer: black background, white text */
    footer {
      background-color: black;
      color: white;
      padding: 10px 0;
    }

    /* Container styling to keep content centered */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Link styling */
    a {
      color: #ffa500; /* contrasting orange for links */
      text-decoration: none;
    }
    
    a:hover {
      text-decoration: underline;
    }

    /* Hide or show forms if needed */
    .form-container {
      display: none;
      margin: 20px;
    }
    .form-container.active {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="container">
        <h1 class="logo">
          <a href="index1.html">Sukhbat</a>
        </h1>
        <ul>
          <li><a href="dashboard.html" class="current">Dashboard</a></li>
          <li><a href="lesson.html">Lesson</a></li>
          <li><a href="action1.html">Photos</a></li>
          <li><a href="award1.html">Awards</a></li>
          <li><a href="contact1.html">Contact</a></li>
          <li><a href="profile.html">My profile</a></li>
          <!-- Logout link -->
          <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <section id="dashboard" class="py-3">
      <div class="container">
        <h2>Hello!</h2>
        <p>WELCOME TO MY WEBSITE. I will create more contents of my Jiu Jitsu highlights <3.</p>
        <img src="img1/t2.jpg" style="width: 300px; height: auto;" alt="Jiu Jitsu Highlight">
        <!-- Additional dashboard content can be added here -->
      </div>
    </section>
  </main>

  <script>
    // Logout functionality: clear the auth token and redirect to the sign-in page.
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      window.location.href = 'sign.html';
    });
  </script>
</body>
</html>
