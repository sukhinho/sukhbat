<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="keywords" content="Sukhinho Jiu Jitsu, Dashboard" />
  <title>Sukhinho Jiu Jitsu Dashboard</title>

  <script src="https://kit.fontawesome.com/8a206a71da.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" media="screen and (max-width: 768px)" href="css/mobile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #333;
      color: white;
      padding: 10px 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    a {
      color: #ffa500;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    main {
      display: flex;
      justify-content: space-between;
      padding: 20px;
    }

    #chat-container {
      width: 300px;
      height: 400px;
      background-color: #222;
      border: 1px solid #555;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      border-bottom: 1px solid #555;
      padding: 10px;
      background-color: #111;
    }

    #messages div {
      background-color: #333;
      color: #fff;
      padding: 6px 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      word-break: break-word;
    }

    #chat-input input {
  flex: 1;
  padding: 8px;
  border-radius: 4px;
  border: 1px solid #888;
  background-color: #111;
  color: white;
}

#chat-input input::placeholder {
  color: #bbb;
}

    #chat-input input::placeholder {
      color: #999;
    }

    #chat-input button {
      background-color: #ffa500;
      border: none;
      padding: 8px 14px;
      color: black;
      cursor: pointer;
      border-radius: 4px;
    }

    #chat-input button:hover {
      background-color: #ffb733;
    }
  </style>
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="container">
        <h1 class="logo"><a href="index1.html">Sukhbat</a></h1>
        <ul>
          <li><a href="dashboard.html" class="current">Dashboard</a></li>
          <li><a href="lesson.html">Lesson</a></li>
          <li><a href="action1.html">Photos</a></li>
          <li><a href="award1.html">Awards</a></li>
          <li><a href="contact1.html">Contact</a></li>
          <li><a href="profile.html">My profile</a></li>
          <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <div>
      <h2>Hello!</h2>
      <p>WELCOME TO MY WEBSITE. I will create more contents of my Jiu Jitsu highlights <3.</p>
      <img src="img1/t2.jpg" style="width: 300px; height: auto;" alt="Jiu Jitsu Highlight">
    </div>

    <div id="chat-container">
      <div id="messages"></div>
      <div id="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      window.location.href = 'sign.html';
    });

    let socket;

    function setupWebSocket() {
      socket = new WebSocket('ws://localhost:8080/ws');
      const messagesDiv = document.getElementById('messages');
      const input = document.getElementById('messageInput');

      socket.onopen = () => {
        console.log("✅ WebSocket connected");
      };

      socket.onmessage = (event) => {
        const msg = document.createElement('div');
        msg.textContent = event.data;
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      };

      socket.onclose = () => {
        console.warn("⚠️ WebSocket closed — retrying in 3s...");
        setTimeout(setupWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error("❌ WebSocket error:", err);
        socket.close();
      };

      window.sendMessage = () => {
        const text = input.value.trim();
        if (text && socket.readyState === WebSocket.OPEN) {
          socket.send(text);
          input.value = '';
        }
      };
    }

    setupWebSocket();
  </script>
</body>
</html>
